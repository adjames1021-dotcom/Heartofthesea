<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1428" />
    <title>Heart of the Sea</title>
    <meta name="description" content="An open sea with islands to sail between." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&family=Spectral:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="title" aria-hidden="true">
      <h1>Heart of the Sea</h1>
    </header>

    <aside id="panel" class="panel">
      <div class="rows">
        <button id="sound" type="button" aria-pressed="false">Sound off</button>
        <button id="controls" type="button">Controls (H)</button>
        <button id="sailing" type="button">Sailing: Arcade</button>
        <div id="settings-version" class="ver"></div>
      </div>
      <button id="settings-toggle" class="toggle" type="button" aria-expanded="false" aria-controls="panel">Settings</button>
    </aside>

    <div id="start" class="start">Click to start. Press H for controls.</div>
    <div id="version" class="version"></div>
    <div class="curtain" aria-hidden="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
